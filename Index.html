<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Internship Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 60px 20px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    main {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Frontend Internship Project</h1>
    <p>My website is live with GitHub Pages 🚀</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome!</h2>
      <p>This project is built using HTML, CSS, and JavaScript.</p>
      <button onclick="showMessage()">Click Me</button>
      <p id="message"></p>
    </div>
  </main>

  <footer>
    <p>Created for Frontend Internship</p>
  </footer>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Thank you for visiting my website! 🎉";
    }
  </script>

</body>
</html>
